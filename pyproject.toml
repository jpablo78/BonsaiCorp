[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai-packaging-optimization"
version = "0.1.0"
description = "Optimización de packaging y logística para Bonsai Corp"
requires-python = ">=3.11"
dependencies = [
    "cplex>=22.2,<23",
    "docplex>=2.32,<3",
    "highspy>=1.15,<2",
    "ortools>=9.10,<10",
]

[project.scripts]
bonsai-optimize = "bonsai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
